<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 300" width="846" height="300" role="img" aria-labelledby="t d">
<title id="t">Hola, soy Brayan</title>
<desc id="d">Desarrollador web junior en Madrid. Busco prácticas y primer empleo. El dibujo imita el frontal de un switch de red de 24 puertos con varios LED encendidos.</desc>
<style>
text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; fill: #F2F4FF }
.verde { fill: #45E08B }
.ambar { fill: #FFB52E }
.apagado { fill: #3A3F96 }
/* Los LED ámbar parpadean como los de actividad de un switch */
.act { animation: actividad 1.9s steps(1, end) infinite }
@keyframes actividad { 0%, 18%, 44%, 70% { opacity: 1 } 10%, 30%, 58%, 86% { opacity: .15 } }
/* El LED de estado respira despacio */
.estado { animation: latido 3s ease-in-out infinite }
@keyframes latido { 0%, 100% { opacity: .18 } 50% { opacity: .5 } }
@media (prefers-reduced-motion: reduce) { .act, .estado { animation: none } }
</style>
