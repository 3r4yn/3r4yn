<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 226" width="846" height="226" role="img" aria-labelledby="t d">
<title id="t">Mi camino</title>
<desc id="d">Mi camino en cinco etapas, dibujadas como puertos de un panel de red. 2020 a 2021: técnico reparador en una tienda de móviles y ordenadores. 2021 a 2023: Grado Medio de SMR en el IES Tetuán de las Victorias. 2023 a 2025: técnico informático en Medios Avanzados, Alcobendas. 2025 a 2027: Grado Superior de DAW en el IES Tetuán de las Victorias; ahora estoy en 2.º curso. Lo siguiente: prácticas y primer empleo como desarrollador.</desc>
<style>
text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; fill: #F2F4FF }
.verde { fill: #45E08B }
.ambar { fill: #FFB52E }
.apagado { fill: #3A3F96 }
/* Los LED ámbar parpadean como los de actividad de un switch */
.act { animation: actividad 1.9s steps(1, end) infinite }
@keyframes actividad { 0%, 18%, 44%, 70% { opacity: 1 } 10%, 30%, 58%, 86% { opacity: .15 } }
@media (prefers-reduced-motion: reduce) { .act, .estado { animation: none } }
</style>
